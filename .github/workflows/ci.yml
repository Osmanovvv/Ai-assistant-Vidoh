name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Новый пуш в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Типы, линтер, формат, тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Формат
        run: npm run format:check

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
