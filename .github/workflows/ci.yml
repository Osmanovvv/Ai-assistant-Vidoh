name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Новый пуш в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Типы, линтер, формат, тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Тот же образ, что в разработке и в бою: расширение vector должно
        # существовать, иначе первая миграция не применится.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vydoh
          POSTGRES_PASSWORD: vydoh
          POSTGRES_DB: vydoh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vydoh -d vydoh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        # Нужен блокировке пользователя и очереди конвейера (§9.1 ТЗ).
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgres://vydoh:vydoh@localhost:5432/vydoh_test
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: ffmpeg для тестов нарезки аудио
        run: |
          ffmpeg -version >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          }
          ffmpeg -version | head -1

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Формат
        run: npm run format:check

      - name: Модульные тесты
        run: npm test

      - name: Интеграционные тесты
        run: npm run test:int

      - name: Сборка
        run: npm run build
